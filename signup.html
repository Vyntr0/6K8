```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatLoop - Sign Up</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#6C63FF,#4FC3F7,#7CFFB2);
}

.signup-box{
    width:420px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#5865F2;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:2px solid #dddddd;
    font-size:16px;
}

input:focus{
    outline:none;
    border-color:#5865F2;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#5865F2;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    transform:scale(1.02);
}

.links{
    text-align:center;
    margin-top:20px;
}

.links a{
    color:#5865F2;
    text-decoration:none;
}

.links a:hover{
    text-decoration:underline;
}

.avatar-preview{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#f0f0f0;
    margin:15px auto;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
}
</style>
</head>

<body>

<div class="signup-box">

<h1>Create Account</h1>

<form action="home.html">

<input
type="text"
placeholder="Display Name"
required
>

<input
type="text"
placeholder="Username"
required
>

<input
type="email"
placeholder="Email"
required
>

<input
type="password"
placeholder="Password"
required
>

<input
id="emojiInput"
type="text"
maxlength="2"
placeholder="Avatar Emoji (😀)"
oninput="updateAvatar()"
>

<div class="avatar-preview" id="avatar">
😀
</div>

<button type="submit">
Create Account
</button>

</form>

<div class="links">
Already have an account?
<br><br>
<a href="login.html">Log In</a>
</div>

</div>

<script>
function updateAvatar(){

const emoji =
document.getElementById("emojiInput").value;

document.getElementById("avatar").textContent =
emoji || "😀";

}
</script>

</body>
</html>
```
