```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatLoop Demo</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#202225;
    color:white;
}

#login,#app{
    max-width:900px;
    margin:30px auto;
    padding:20px;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:none;
    border-radius:8px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#5865F2;
    color:white;
}

#app{
    display:none;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.main{
    display:flex;
    gap:20px;
    margin-top:20px;
}

.users{
    width:250px;
    background:#2f3136;
    padding:10px;
    border-radius:10px;
}

.chat{
    flex:1;
    background:#2f3136;
    padding:10px;
    border-radius:10px;
}

.user{
    background:#40444b;
    padding:10px;
    margin:6px 0;
    border-radius:8px;
}

#messages{
    height:300px;
    overflow-y:auto;
    margin-bottom:10px;
}

.msg{
    background:#40444b;
    padding:8px;
    margin:5px 0;
    border-radius:6px;
}
</style>
</head>

<body>

<div id="login">

<h1>ChatLoop Demo</h1>

<input id="username" placeholder="Username">

<button onclick="createAccount()">
Create / Login
</button>

</div>

<div id="app">

<div class="top">
<h2 id="welcome"></h2>

<button onclick="logout()">
Logout
</button>
</div>

<div class="main">

<div class="users">

<h3>Users</h3>

<div id="userList"></div>

</div>

<div class="chat">

<h3>Global Chat</h3>

<div id="messages"></div>

<input id="messageBox" placeholder="Type a message">

<button onclick="sendMessage()">
Send
</button>

</div>

</div>

</div>

<script>

let currentUser="";

let users=JSON.parse(localStorage.getItem("users")||"[]");

let messages=JSON.parse(localStorage.getItem("messages")||"[]");

function createAccount(){

let name=document.getElementById("username").value.trim();

if(name=="") return;

currentUser=name;

if(!users.includes(name)){
users.push(name);
localStorage.setItem("users",JSON.stringify(users));
}

document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";

document.getElementById("welcome").innerText="Welcome "+currentUser;

renderUsers();

renderMessages();

}

function renderUsers(){

let html="";

users.forEach(u=>{

html+=`
<div class="user">
${u}
</div>
`;

});

document.getElementById("userList").innerHTML=html;

}

function renderMessages(){

let html="";

messages.forEach(m=>{

html+=`
<div class="msg">
<b>${m.user}</b>: ${m.text}
</div>
`;

});

document.getElementById("messages").innerHTML=html;

}

function sendMessage(){

let text=document.getElementById("messageBox").value.trim();

if(text=="") return;

messages.push({

user:currentUser,

text:text

});

localStorage.setItem("messages",JSON.stringify(messages));

document.getElementById("messageBox").value="";

renderMessages();

}

function logout(){

location.reload();

}

</script>

</body>
</html>
```
