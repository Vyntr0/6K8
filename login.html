```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatLoop - Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#6C63FF,#4FC3F7,#7CFFB2);
}

.login-box{
    width:400px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:#5865F2;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:2px solid #ddd;
    font-size:16px;
}

input:focus{
    outline:none;
    border-color:#5865F2;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#5865F2;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.links{
    text-align:center;
    margin-top:20px;
}

.links a{
    color:#5865F2;
    text-decoration:none;
}

.links a:hover{
    text-decoration:underline;
}
</style>

</head>
<body>

<div class="login-box">

<h1>ChatLoop</h1>

<form action="home.html">

<input
type="text"
placeholder="Username"
required
>

<input
type="password"
placeholder="Password"
required
>

<button type="submit">
Log In
</button>

</form>

<div class="links">
<p>Don't have an account?</p>
<a href="signup.html">Create Account</a>
<br><br>
<a href="#">Forgot Password?</a>
</div>

</div>

</body>
</html>
```
